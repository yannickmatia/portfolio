name: Update Substack writing

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-substack-writing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh writing page
        run: node scripts/update-writing.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- writing.html; then
            echo "Writing page is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.html
          git commit -m "Update writing from Substack"
          git push
