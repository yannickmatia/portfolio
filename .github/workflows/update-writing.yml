name: Update Substack writing

on:
  push:
    paths:
      - ".github/workflows/update-writing.yml"
      - "content/writing.json"
      - "scripts/update-writing.mjs"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-substack-writing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download Substack feed
        run: >-
          curl --fail --location --show-error --silent
          --retry 4 --retry-all-errors --retry-delay 3
          --header "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8"
          --user-agent "Mozilla/5.0 (compatible; YannickMatiaPortfolio/1.0)"
          --output /tmp/substack-feed.xml
          "https://yannickmatia.substack.com/feed"
      - name: Refresh writing page
        run: node scripts/update-writing.mjs --feed-file /tmp/substack-feed.xml
      - name: Commit changes
        run: |
          if git diff --quiet -- writing.html; then
            echo "Writing page is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.html
          git commit -m "Update writing from Substack"
          git push
